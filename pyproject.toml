[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-model-router"
version = "0.5.0"
description = "Route prompts to the smallest capable LLM to cut cost and carbon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "medthemed", email = "medthemed@users.noreply.github.com" }]
keywords = ["llm", "routing", "cost", "carbon", "green-ai", "prompt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
cmr = "carbon_model_router.cli:main"

[project.urls]
Homepage = "https://github.com/medthemed/carbon-model-router"
Repository = "https://github.com/medthemed/carbon-model-router"
Issues = "https://github.com/medthemed/carbon-model-router/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["carbon_model_router"]
